name: CI

on:
  push:
    branches:
      - master
  
  pull_request:
     branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with: 
          go-version: '1.25'
          cache: true
      
      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"
      
      - name: Run vet
        run: go vet ./...
      
      - name: Run tests
        run: go test -v ./...
      
      - name: Build
        run: go build ./...